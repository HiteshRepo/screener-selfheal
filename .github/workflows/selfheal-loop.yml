name: Self-Heal Loop

# Triggered manually via the GitHub Actions UI.
# Optionally accepts a target URL override; if omitted, run_selfheal.py uses
# its own default (https://www.screener.in/screens/dividend-yield/).
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Override the collector's default target URL"
        required: false
        default: "https://hiteshrepo.github.io/screener-selfheal/demo/mirror/index.html"
      pages_just_updated:
        description: "Set to true to wait 30s for GitHub Pages propagation before scraping"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  selfheal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for GitHub Pages propagation
        if: ${{ inputs.pages_just_updated == true }}
        run: sleep 30

      - name: Select collector
        run: |
          if echo "${{ inputs.target_url }}" | grep -q "github.io"; then
            echo "BRIGHT_DATA_COLLECTOR_ID=${{ secrets.BRIGHT_DATA_DEMO_COLLECTOR_ID }}" >> "$GITHUB_ENV"
          else
            echo "BRIGHT_DATA_COLLECTOR_ID=${{ secrets.BRIGHT_DATA_COLLECTOR_ID }}" >> "$GITHUB_ENV"
          fi

      - name: Run self-heal loop
        env:
          BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}
          BRIGHT_DATA_COLLECTOR_ID: ${{ env.BRIGHT_DATA_COLLECTOR_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "${{ inputs.target_url }}" ]; then
            python src/run_selfheal.py --target-url "${{ inputs.target_url }}"
          else
            python src/run_selfheal.py
          fi

      - name: Commit results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="chore/selfheal-$(date -u +%Y-%m-%dT%H-%M-%S)"
          git checkout -b "$BRANCH"
          if echo "${{ inputs.target_url }}" | grep -q "github.io"; then
            git add data/demo/latest.json || true
            git add data/demo/changes-*.md 2>/dev/null || true
          else
            git add data/production/latest.json || true
            git add data/production/changes-*.md 2>/dev/null || true
          fi
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "chore: selfheal results"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: selfheal results [skip ci]" \
            --body "Automated self-heal results from $(date -u +%Y-%m-%d)." \
            --base main \
            --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --delete-branch || gh pr merge "$BRANCH" --auto --squash || true
