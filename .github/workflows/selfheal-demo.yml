name: Self-Healing Demo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper against mirror URL
        env:
          BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}
          BRIGHT_DATA_COLLECTOR_ID: ${{ secrets.BRIGHT_DATA_COLLECTOR_ID }}
          DEMO_TARGET_URL: https://hiteshrepo.github.io/screener-selfheal/demo/mirror/index.html
        run: |
          python src/run_scrape.py \
            --url "$DEMO_TARGET_URL" \
            --output data/demo-latest.json

      - name: Commit demo results
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/demo-latest.json || true
          git diff --cached --quiet || git commit -m "chore: demo scrape results [skip ci]"
          git push
