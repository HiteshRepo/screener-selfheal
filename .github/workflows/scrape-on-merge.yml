name: Scrape on Merge

# Triggers on every push to main.
# NOTE: GitHub natively skips this workflow when the commit message contains
# "[skip ci]", which prevents the bot's own commit from re-triggering the
# workflow (task 6.4 — no extra configuration required for the default
# GITHUB_TOKEN).
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrape pipeline
        id: scrape
        env:
          BRIGHT_DATA_API_TOKEN: ${{ secrets.BRIGHT_DATA_API_TOKEN }}
          BRIGHT_DATA_COLLECTOR_ID: ${{ secrets.BRIGHT_DATA_COLLECTOR_ID }}
        run: |
          python src/run_scrape.py
          python src/run_diff.py

      - name: Commit results
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="chore/scrape-$(date -u +%Y-%m-%dT%H-%M-%S)"
          git checkout -b "$BRANCH"
          git add data/latest.json "data/changes-$(date -u +%Y-%m-%d).md" || true
          git diff --cached --quiet && { echo "No changes to commit."; exit 0; }
          git commit -m "chore: scrape results"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: scrape results [skip ci]" \
            --body "Automated scrape results from $(date -u +%Y-%m-%d)." \
            --base main \
            --head "$BRANCH"
          gh pr merge "$BRANCH" --squash --delete-branch || gh pr merge "$BRANCH" --auto --squash || true

      - name: Trigger self-heal if record count is zero
        if: steps.scrape.conclusion == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RECORD_COUNT=$(python -c "import json; d=json.load(open('data/latest.json')); print(d['meta']['record_count'])")
          echo "record_count=$RECORD_COUNT"
          if [ "$RECORD_COUNT" -eq 0 ]; then
            echo "Empty result set — triggering self-heal loop."
            gh workflow run selfheal-loop.yml
          else
            echo "Result set healthy ($RECORD_COUNT records) — no self-heal needed."
          fi
