name: Break Mirror

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  break-mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect current layout
        run: |
          if grep -q "layout: v1" demo/mirror/index.html; then
            echo "CURRENT_LAYOUT=v1" >> "$GITHUB_ENV"
            echo "NEXT_LAYOUT=v2" >> "$GITHUB_ENV"
          else
            echo "CURRENT_LAYOUT=v2" >> "$GITHUB_ENV"
            echo "NEXT_LAYOUT=v1" >> "$GITHUB_ENV"
          fi

      - name: Swap layout
        run: |
          if [ "$CURRENT_LAYOUT" = "v1" ]; then
            cp demo/mirror/v2.html demo/mirror/index.html
          else
            cp demo/mirror/v1.html demo/mirror/index.html
          fi

      - name: Commit and push via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          BRANCH="chore/mirror-layout-${NEXT_LAYOUT}-$(date -u +%Y-%m-%dT%H-%M-%S)"
          git checkout -b "$BRANCH"
          git add demo/mirror/index.html
          git commit -m "chore: switch mirror layout to ${NEXT_LAYOUT} [skip ci]"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore: switch mirror layout to ${NEXT_LAYOUT} [skip ci]" \
            --body "Automated layout swap from ${CURRENT_LAYOUT} to ${NEXT_LAYOUT} for self-heal demo." \
            --base main \
            --head "$BRANCH"
          gh pr merge "$BRANCH" --auto --squash

      - name: Write step summary
        run: echo "Mirror is now layout ${NEXT_LAYOUT}" >> "$GITHUB_STEP_SUMMARY"
